version: '3.8'

# Opcional si no se usa XAMPP local: solo 2 contenedores (MySQL 8.0 + Apache/PHP 8.2)
services:
  mysql:
    image: mysql:8.0
    container_name: sgau-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bd_matricula_universitaria
    ports:
      - "3306:3306"
    volumes:
      - ./database/releases/bd_matricula_universitaria_v4.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - mysql_data:/var/lib/mysql

  php-api:
    image: php:8.2-apache
    container_name: sgau-php-api
    restart: always
    ports:
      - "8000:80"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: bd_matricula_universitaria
      JWT_SECRET: super_secret_jwt_key_unjbg_2026
    volumes:
      - ./backend/public:/var/www/html
      - ./backend:/var/www/backend
    depends_on:
      - mysql

volumes:
  mysql_data:
