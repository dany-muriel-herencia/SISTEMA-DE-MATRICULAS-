<!DOCTYPE html>
<html lang="es">

  <title>Nómina Oficial de Matrícula por Sección</title>

  </style>
</head>
<body>

        <th>N°</th>

        <th>Estudiante</th>

    </thead>
    <tbody>
      <!-- Filas de estudiantes -->
    </tbody>
  </table>

</html>
