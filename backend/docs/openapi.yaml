    "/api/secciones": {
      "get": {
        "parameters": [
          {
            "required": true,
            "in": "query",
            "name": "periodo_id",
            "schema": {
              "maximum": 2147483647,
              "minimum": 1,
              "type": "integer"
            }
          },
          {
            "required": false,
            "in": "query",
            "name": "curso_id",
            "schema": {
              "maximum": 2147483647,
              "minimum": 1,
              "type": "integer"
            }
          }
        ],
        "summary": "Listar secciones por periodo y opcionalmente curso",
        "responses": {
          "200": {
            "description": "Respuesta con success, message y data"
          },
          "401": {
            "description": "Sesion invalida"
          },
          "422": {
            "description": "Datos invalidos"
          }
        }
      },
      "post": {
        "description": "Vacantes disponibles se inicializan con vacantes. Codigo unico por periodo. Curso y docente deben estar activos.",
