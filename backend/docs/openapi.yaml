        ],
        "summary": "Consultar seccion con su lista de horarios",
        "responses": {
          "422": {
            "description": "Datos invalidos"
          },
          "404": {
            "description": "Seccion inexistente"
          },
          "401": {
            "description": "Sesion invalida"
