              }
            }
          },
          "required": true
        },
        "responses": {
          "403": {
            "description": "Requiere ADMIN o COORDINADOR"
          },
          "401": {
            "description": "Sesion invalida"
          },
          "201": {
            "description": "Recurso creado con su identificador en data"
          },
          "422": {
            "description": "Datos invalidos, referencia ausente o conflicto de programacion"
          }
        }
      }
    },
