  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "Token aleatorio de sesión; no es JWT."
      }
    },
    "schemas": {
      "Login": {
        "type": "object",
        "required": [
          "email",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string"
          }
        }
      },
      "Usuario": {
        "type": "object",
        "required": [
          "nombre",
          "email",
          "password",
          "rol"
        ],
        "properties": {
          "nombre": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "minLength": 8
          },
          "rol": {
            "type": "string",
            "enum": [
              "ADMIN",
              "COORDINADOR",
              "DOCENTE",
              "ESTUDIANTE"
            ]
          }
        }
      },
      "Estudiante": {
        "type": "object",
        "required": [
          "usuario_id",
          "codigo_universitario",
          "dni",
          "fecha_nacimiento",
          "fecha_ingreso"
        ],
        "properties": {
          "usuario_id": {
            "type": "integer",
            "minimum": 1
          },
          "codigo_universitario": {
            "type": "string"
          },
          "dni": {
            "type": "string",
            "pattern": "^[0-9]{8}$"
          },
          "fecha_nacimiento": {
            "type": "string",
            "format": "date"
          },
          "fecha_ingreso": {
            "type": "string",
            "format": "date"
          }
        }
      },
      "Curso": {
        "type": "object",
        "required": [
          "codigo",
          "nombre",
          "creditos"
        ],
        "properties": {
          "codigo": {
            "type": "string"
          },
          "nombre": {
            "type": "string"
          },
          "creditos": {
            "type": "integer",
            "minimum": 1
          },
          "horas_teoria": {
            "type": "integer",
            "minimum": 0,
            "default": 2
          },
          "horas_practica": {
            "type": "integer",
            "minimum": 0,
            "default": 2
          },
          "ciclo": {
            "type": "string",
            "default": "1"
          }
        }
      },
      "Matricula": {
        "type": "object",
        "required": [
          "estudiante_id",
          "periodo_id",
          "secciones"
        ],
        "properties": {
          "estudiante_id": {
            "type": "integer",
            "minimum": 1
          },
          "periodo_id": {
            "type": "integer",
            "minimum": 1
          },
          "secciones": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "integer",
              "minimum": 1
            }
          }
        }
      },
      "CrearSeccion": {
        "required": [
          "id_curso",
          "id_periodo",
          "id_docente",
          "codigo",
          "vacantes"
        ],
        "properties": {
          "id_docente": {
            "maximum": 2147483647,
            "minimum": 1,
            "type": "integer"
          },
          "vacantes": {
            "maximum": 2147483647,
            "minimum": 1,
            "type": "integer"
          },
          "id_periodo": {
            "maximum": 2147483647,
            "minimum": 1,
            "type": "integer"
          },
          "codigo": {
            "maxLength": 30,
            "minLength": 1,
            "type": "string"
          },
          "id_curso": {
            "maximum": 2147483647,
            "minimum": 1,
            "type": "integer"
          }
        },
        "type": "object"
      },
      "CrearHorario": {
        "required": [
          "id_aula",
          "dia_semana",
          "hora_inicio",
          "hora_fin",
          "modalidad"
        ],
        "properties": {
          "hora_fin": {
            "type": "string",
            "pattern": "^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$"
          },
          "id_aula": {
            "maximum": 2147483647,
            "minimum": 1,
            "type": "integer"
          },
          "hora_inicio": {
            "type": "string",
            "pattern": "^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$"
          },
          "modalidad": {
            "type": "string",
            "enum": [
              "PRESENCIAL",
              "VIRTUAL",
              "HIBRIDA"
            ]
          },
          "dia_semana": {
            "type": "string",
            "enum": [
              "LUNES",
              "MARTES",
              "MIERCOLES",
              "JUEVES",
              "VIERNES",
              "SABADO",
              "DOMINGO"
            ]
          }
        },
        "type": "object"
      }
    }
  }
}
