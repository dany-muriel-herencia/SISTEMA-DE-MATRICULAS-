          "200": {
            "description": "Respuesta con success, message y data"
          }
        }
      }
    },
    "/api/secciones/{id}/horarios": {
      "post": {
        "description": "Rechaza cruces de aula, docente o seccion dentro del mismo periodo. Admite intervalos contiguos. Requiere aula disponible con capacidad suficiente, incluso para VIRTUAL. No permite agregar horarios si hay detalles de matricula no anulados.",
        "parameters": [
          {
            "required": true,
            "in": "path",
            "name": "id",
            "schema": {
              "maximum": 2147483647,
              "minimum": 1,
              "type": "integer"
            }
